<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <title>The Watcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage"></canvas>
  <video id="cam" playsinline muted autoplay></video>

  <!-- Start screen: needed so the browser lets us use the camera + sound -->
  <div id="intro" class="overlay">
    <div class="card">
      <h1>The Watcher</h1>
      <p>A spectre that only appears when someone is in view. It creeps toward
        them while they look away &mdash; and stops the moment they look back.</p>
      <button id="startBtn">Begin</button>
      <p id="introMsg" class="msg"></p>
      <p class="hint">Double-tap (or press <kbd>S</kbd>) for settings &middot; <kbd>D</kbd> for debug view &middot; <kbd>F</kbd> fullscreen</p>
    </div>
  </div>

  <!-- Settings panel -->
  <div id="panel" class="panel hidden">
    <div class="panel-head">
      <strong>Settings</strong>
      <button id="closePanel" aria-label="Close">&times;</button>
    </div>

    <label>Character
      <select id="set-mode">
        <option value="turn">Ghost &mdash; turns its back when watched</option>
        <option value="stone">Statue &mdash; freezes to stone when watched</option>
      </select>
    </label>

    <label>Camera
      <select id="set-camera"></select>
    </label>

    <label class="row"><input type="checkbox" id="set-mirror"> Mirror (ghost on the same side as the person)</label>
    <label class="row"><input type="checkbox" id="set-jumpscare"> Jump scare when it reaches you</label>
    <label class="row"><input type="checkbox" id="set-sound"> Sound</label>
    <label class="row"><input type="checkbox" id="set-posefallback"> Also use body pose to guess "looking" (helps far away)</label>
    <label class="row"><input type="checkbox" id="set-debug"> Debug view</label>

    <label>Creep time (seconds of not looking to reach you): <span id="v-creep"></span>
      <input type="range" id="set-creep" min="5" max="90" step="1">
    </label>
    <label>Face detection threshold (lower finds faces further away): <span id="v-sens"></span>
      <input type="range" id="set-sens" min="0.2" max="0.9" step="0.05">
    </label>
    <label>Head-turn tolerance (higher = a glance from the side still counts): <span id="v-facing"></span>
      <input type="range" id="set-facing" min="0.2" max="1" step="0.05">
    </label>
    <label>Volume: <span id="v-vol"></span>
      <input type="range" id="set-vol" min="0" max="1" step="0.05">
    </label>
    <label>Ghost brightness: <span id="v-bright"></span>
      <input type="range" id="set-bright" min="0.3" max="1" step="0.05">
    </label>

    <div class="buttons">
      <button id="fsBtn">Fullscreen</button>
      <button id="resetBtn">Reset ghost</button>
    </div>
  </div>

  <div id="debug" class="hidden">
    <canvas id="debugCanvas"></canvas>
    <pre id="debugText"></pre>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
